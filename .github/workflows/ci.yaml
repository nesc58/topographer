name: CI

on:
  push:
    tags:
      - v*
    branches:
      - master
  release:
    types:
      - published
      - released
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Run tests
        run: go test -coverprofile=./coverage.txt -covermode=atomic -v ./...
        env:
          MAXMIND_API_KEY: ${{ secrets.MAXMIND_API_KEY }}
          IPSTACK_API_KEY: ${{ secrets.IPSTACK_API_KEY }}
          IP2LOCATION_API_KEY: ${{ secrets.IP2LOCATION_API_KEY }}

      - name: Collect coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v6
        with:
          images: nineseconds/topographer,ghcr.io/9seconds/topographer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v4

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GHCR.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          platforms: linux/amd64,linux/arm64,linux/386
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache
